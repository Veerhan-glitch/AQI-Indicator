<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather + AQI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map {
      position: fixed; top: 0; left: 0;
      height: 100%; width: 100%;
      z-index: -1;
    }
    .search-container {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #00000055;
    }
    .info-box {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px #00000055;
      font-family: sans-serif;
      min-width: 300px;
      max-width: 90%;
    }
    .info-content {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .info-section {
      flex: 1 1 250px;
    }
    .info-section u {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="search-container">
    <input type="text" class="search-box" placeholder="Search location..."/>
    <button class="search-button">Search</button>
    <span id="status-message" style="margin-left: 10px;"></span>
  </div>

  <div class="info-box" id="weather-info">Click map or use search to get weather & AQI</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    let map = L.map('map').setView([20, 78], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let marker = null;

    function aqiLabel(aqi) {
      return ['Good', 'Fair', 'Moderate', 'Poor', 'Very Poor'][aqi - 1] || 'Unavailable';
    }

    function aqiColor(aqi) {
      return ['#009966', '#ffde33', '#ff9933', '#cc0033', '#660099'][aqi - 1] || '#888';
    }

    function showData(data) {
      if (marker) map.removeLayer(marker);
      marker = L.marker([data.latitude, data.longitude]).addTo(map)
        .bindPopup(`<b>${data.location}</b>`).openPopup();

      map.flyTo([data.latitude, data.longitude], 10);

      const w = data.weather || {};
      const a = data.aqi || {};
      const weatherValue = (value, suffix = '') =>
        Number.isFinite(value) ? `${value}${suffix}` : 'Unavailable';

      document.getElementById("weather-info").innerHTML = `
        <b>${data.location}</b><br/><br/>
        <div class="info-content">
          <div class="info-section">
            <u>Weather:</u><br/>
            Temp: ${weatherValue(w.temperature_2m, '°C')}<br/>
            Feels like: ${weatherValue(w.apparent_temperature, '°C')}<br/>
            Humidity: ${weatherValue(w.humidity, '%')}<br/>
            Cloud Cover: ${weatherValue(w.cloud_cover, '%')}<br/>
            Wind: ${weatherValue(w.wind_speed_10m, ' km/h')} (${weatherValue(w.wind_direction_10m, '°')})<br/>
            Pressure: ${weatherValue(w.pressure_msl, ' hPa')}<br/>
            Precipitation: ${weatherValue(w.precipitation, ' mm')}<br/>
          </div>
          <div class="info-section">
            <u>Air Quality:</u><br/>
            AQI: ${
              a.aqi_index === -1
                ? "Unavailable"
                : `<span style="color:${aqiColor(a.aqi_index)}">${a.aqi_index} (${aqiLabel(a.aqi_index)})</span>`
            }<br/>
            PM2.5: ${a.pm2_5 ?? '–'} µg/m³<br/>
            PM10: ${a.pm10 ?? '–'} µg/m³<br/>
            NO₂: ${a.no2 ?? '–'} µg/m³<br/>
            O₃: ${a.o3 ?? '–'} µg/m³
          </div>
        </div>
      `;
    }

    async function fetchLocation(url) {
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || `Request failed (${response.status})`);
      }
      return data;
    }

    function searchLocation() {
      const searchTerm = document.querySelector('.search-box').value.trim();
      if (!searchTerm) {
        document.getElementById('status-message').textContent = "❌ Enter a location to search";
        return;
      }
      document.getElementById('status-message').textContent = "⏳ Loading...";
      fetchLocation(`/search?term=${encodeURIComponent(searchTerm)}`)
        .then(data => {
          document.getElementById("status-message").textContent = "";
          showData(data);
        })
        .catch(error => {
          document.getElementById("status-message").textContent = `❌ ${error.message || 'Network request failed'}`;
        });
    }

    document.querySelector('.search-button').addEventListener('click', searchLocation);
    document.querySelector('.search-box').addEventListener('keypress', e => {
      if (e.key === 'Enter') searchLocation();
    });

    map.on('click', e => {
      const { lat, lng } = e.latlng;
      document.getElementById('status-message').textContent = "📍 Fetching location info...";
      fetchLocation(`/reverse?lat=${lat}&lon=${lng}`)
        .then(data => {
          document.getElementById("status-message").textContent = "";
          showData(data);
        })
        .catch(error => {
          document.getElementById("status-message").textContent = `❌ ${error.message || 'Network request failed'}`;
        });
    });
  </script>
</body>
</html>
